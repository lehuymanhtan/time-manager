[pytest]
# Django settings module (use test_settings for SQLite-based testing)
DJANGO_SETTINGS_MODULE = time_mamager.test_settings

# Python files to search for tests
python_files = test_*.py *_test.py *_tests.py

# Python classes to search for tests
python_classes = Test* *Tests *TestCase

# Python functions to search for tests
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    models: marks tests for model layer
    views: marks tests for view layer
    forms: marks tests for form layer
    utils: marks tests for utility functions
    api: marks tests for API endpoints

# Default options (no coverage by default for speed)
addopts =
    --verbose
    --strict-markers
    --tb=short

# Ignore certain patterns
norecursedirs = .git .tox dist build *.egg node_modules staticfiles media

# Console output options
console_output_style = progress

# Fail on warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
